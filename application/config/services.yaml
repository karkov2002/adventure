imports:
  - { resource: parameters.yaml }
  - { resource: packages/paginator.yaml }

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Serverside/DependencyInjection/'
            - '../src/Serverside/Entity/'
            - '../src/Kernel.php'
