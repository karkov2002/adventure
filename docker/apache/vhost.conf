<VirtualHost *:80>
    ServerName local.payot
    DocumentRoot /var/www/html/public

    #ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://php-fpm:${PHP_PORT}${PHP_APP_DIR}$1
    <FilesMatch \.php$>
        SetHandler proxy:fcgi://php-fpm:${PHP_PORT}
    </FilesMatch>

    <Directory "/var/www/html/public">
        DirectoryIndex index.html index.php
        Options +Indexes +Includes +FollowSymLinks +MultiViews
        AllowOverride All
        Order allow,deny
        Allow from all
        Require all granted
    </Directory>

</VirtualHost>

<VirtualHost *:443>
    ServerName local.payot
    DocumentRoot /var/www/html/public

    #ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://php-fpm:${PHP_PORT}${PHP_APP_DIR}$1
    <FilesMatch \.php$>
        SetHandler proxy:fcgi://php-fpm:${PHP_PORT}
    </FilesMatch>

    <Directory "/var/www/html/public">
        DirectoryIndex index.html index.php
        Options +Indexes +Includes +FollowSymLinks +MultiViews
        AllowOverride All
        Order allow,deny
        Allow from all
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile  /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
    SSLCipherSuite RC4-SHA:AES128-SHA:HIGH:!aNULL:!MD5
    SSLHonorCipherOrder on

</VirtualHost>
